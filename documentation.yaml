openapi: 3.0.3
info:
  title: Movie Database API
  version: "1.0.0"
  description: |
    REST API for the Movies dataset. Routes are protected by an API key header `X-API-Key`.
    This file documents Movies, Genres, Studios, People, and the join tables (cast, directors, producers, genres, studios).

    **Published Web API (Beta Version)**  
    Hosted at: [https://tcss460-moviewebapi.onrender.com](https://tcss460-moviewebapi.onrender.com)

    ### Current Implementation Status (Oct 2025)
    **IMPLEMENTED ENDPOINTS:**
    - ✅ `GET /health` - API health check (no API key required)
    - ✅ `GET /moviesbyyear?year=YYYY` - Get movies by release year (fully functional)
    
    **NOT YET IMPLEMENTED:**
    All other endpoints listed in this documentation are part of the planned API design but are not yet available.
    This includes:
    - `/movies` (all methods)
    - `/genres` (all methods)
    - `/studios` (all methods)
    - `/people` (all methods)
    - All relationship endpoints (`/movie_genres`, `/movie_cast`, etc.)

servers:
  - url: https://tcss460-moviewebapi.onrender.com
    description: Production server
  - url: http://localhost:3000
    description: Local development

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required for most endpoints. Contact the administrator to obtain an API key.

  schemas:

    # ----- Primary Entities -----
    Movie:
      type: object
      required:
        - title
      properties:
        movie_id:
          type: integer
          description: Unique identifier for the movie
          example: 123
        title:
          type: string
          description: Movie title
          example: "Inception"
        original_title:
          type: string
          description: Original title (if different from English title)
          example: "Inception"
        release_date:
          type: string
          format: date
          description: Release date in YYYY-MM-DD format
          example: "2010-07-16"
        runtime_min:
          type: integer
          description: Runtime in minutes
          example: 148
        overview:
          type: string
          description: Plot summary or description
          example: "A thief who steals corporate secrets..."
        budget:
          type: integer
          format: int64
          description: Production budget in USD
          example: 160000000
        revenue:
          type: integer
          format: int64
          description: Box office revenue in USD
          example: 825532764
        mpa_rating:
          type: string
          description: MPA rating (G, PG, PG-13, R, NC-17, etc.)
          example: "PG-13"
        collection:
          type: string
          nullable: true
          description: Movie collection or franchise name
          example: "The Inception Collection"
        poster_url:
          type: string
          format: uri
          description: URL to movie poster image
          example: "https://image.tmdb.org/t/p/w500/xxx.jpg"
        backdrop_url:
          type: string
          format: uri
          description: URL to backdrop/banner image
          example: "https://image.tmdb.org/t/p/w1280/yyy.jpg"

    Genre:
      type: object
      properties:
        genre_id:
          type: integer
          description: Unique identifier for the genre
          example: 1
        name:
          type: string
          description: Genre name
          example: "Action"

    Studio:
      type: object
      properties:
        studio_id:
          type: integer
          description: Unique identifier for the studio
          example: 10
        name:
          type: string
          description: Studio name
          example: "Warner Bros."
        country:
          type: string
          description: Country where studio is based
          example: "USA"
        logo_url:
          type: string
          format: uri
          description: URL to studio logo
          example: "https://studio.example.com/logos/warner.png"

    Person:
      type: object
      properties:
        person_id:
          type: integer
          description: Unique identifier for the person
          example: 501
        name:
          type: string
          description: Full name
          example: "Christopher Nolan"
        profile_url:
          type: string
          format: uri
          description: URL to profile photo
          example: "https://image.tmdb.org/t/p/w300/zzz.jpg"

    # ----- Join / Relationship Entities -----
    Movie_Genre:
      type: object
      required:
        - movie_id
        - genre_id
      properties:
        movie_genre_id:
          type: integer
          description: Unique identifier for this association
          example: 1001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        genre_id:
          type: integer
          description: Reference to genre
          example: 1

    Movie_Cast:
      type: object
      required:
        - movie_id
        - person_id
      properties:
        uniqueId:
          type: integer
          description: Primary key for the movie_cast row
          example: 3001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        person_id:
          type: integer
          description: Reference to person (actor)
          example: 900
        character_name:
          type: string
          description: Name of character played
          example: "Dom Cobb"
        cast_order:
          type: integer
          description: Billing order (1 = top billing)
          example: 1

    Movie_Director:
      type: object
      required:
        - movie_id
        - person_id
      properties:
        movie_director_id:
          type: integer
          description: Unique identifier for this association
          example: 4001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        person_id:
          type: integer
          description: Reference to person (director)
          example: 501

    Movie_Producer:
      type: object
      required:
        - movie_id
        - person_id
      properties:
        movie_producer_id:
          type: integer
          description: Unique identifier for this association
          example: 5001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        person_id:
          type: integer
          description: Reference to person (producer)
          example: 602

    Movie_Studios:
      type: object
      required:
        - movie_id
        - studio_id
      properties:
        movie_studios_id:
          type: integer
          description: Unique identifier for this association
          example: 6001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        studio_id:
          type: integer
          description: Reference to studio
          example: 10

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Not found"
    
    BadRequest:
      description: Bad request - invalid input or parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid input"
    
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Unauthorized - invalid or missing API key"
    
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Internal server error"
    
    NotImplemented:
      description: Endpoint not yet implemented
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "This endpoint is not yet implemented"

paths:

  ### ----------------------------
  ### ✅ IMPLEMENTED ENDPOINT
  ### ----------------------------

  /moviesbyyear:
    get:
      tags:
        - movies
      summary: "✅ IMPLEMENTED - Get movies by release year"
      description: |
        **STATUS: FULLY IMPLEMENTED**
        
        Returns all movies released in the specified year. This endpoint queries the cloud-hosted SQLite database.
        
        Example usage: `/moviesbyyear?year=2025`
        
        Test cases available in Postman collection.
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
          description: Year of release in YYYY format (e.g., 2025)
          example: "2025"
      security: []
      responses:
        '200':
          description: List of movies released in the specified year
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:
                    type: string
                    example: "2025"
                  count:
                    type: integer
                    example: 5
                  movies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  ### ----------------------------
  ### ❌ NOT YET IMPLEMENTED
  ### ----------------------------

