        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  ### ----------------------------
  ### Movie_Genres (join)
  ### ----------------------------

  /movie_genres:
    get:
      tags:
        - relationships
      summary: List movie-genre associations
      description: Retrieve all movie-genre relationship records.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of movie-genre associations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movie_Genre'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - relationships
      summary: Associate a movie with a genre
      description: Create a new movie-genre relationship.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie_Genre'
      responses:
        '201':
          description: Association successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie_Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /movie_genres/{movie_genre_id}:
    parameters:
      - in: path
        name: movie_genre_id
        required: true
        schema:
          type: integer
        description: The unique identifier of the movie-genre association
        example: 1001
    
    delete:
      tags:
        - relationships
      summary: Remove movie-genre association
      description: Delete a movie-genre relationship.
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Association successfully removed (no content returned)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  ### ----------------------------
  ### Movie_Cast
  ### ----------------------------

  /movie_cast:
    get:
      tags:
        - relationships
      summary: List cast entries
      description: Retrieve all movie cast member records.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of cast entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movie_Cast'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - relationships
      summary: Add a cast member to a movie
      description: Create a new movie cast record.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie_Cast'
      responses:
        '201':
          description: Cast member successfully added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie_Cast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /movie_cast/{uniqueId}:
    parameters:
      - in: path
        name: uniqueId
        required: true
        schema:
          type: integer
