openapi: 3.0.3
info:
  title: Movie Database API
  version: "1.0.0"
  description: |
    REST API for the Movies dataset. Routes are protected by an API key header `X-API-Key`.
    This file documents Movies, Genres, Studios, People, and the join tables (cast, directors, producers, genres, studios).

    **Published Web API (Beta Version)**  
    Hosted at: [https://tcss460-moviewebapi.onrender.com](https://tcss460-moviewebapi.onrender.com)

    ### Updates for Beta Sprint (Oct 2025)
    - Added `GET /moviesbyyear?year=YYYY` route that queries the external (cloud-hosted) SQLite database.
    - Implemented routes: `/health`, `/movies`, `/movies/:id`, and `/moviesbyyear`.
    - Postman tests included in `/testing/postman/postman.json` (covers implemented routes).
    - Other routes are part of the final API design and are marked as **Not Implemented Yet**.
    - Documentation hosted at `/api-docs` for class-wide consistency.

servers:
  - url: https://tcss460-moviewebapi.onrender.com/v1
    description: Production server
  - url: http://localhost:3000/v1
    description: Local development

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required for most endpoints. Contact the administrator to obtain an API key.

  schemas:

    # ----- Primary Entities -----
    Movie:
      type: object
      required:
        - title
      properties:
        movie_id:
          type: integer
          description: Unique identifier for the movie
          example: 123
        title:
          type: string
          description: Movie title
          example: "Inception"
        original_title:
          type: string
          description: Original title (if different from English title)
          example: "Inception"
        release_date:
          type: string
          format: date
          description: Release date in YYYY-MM-DD format
          example: "2010-07-16"
        runtime_min:
          type: integer
          description: Runtime in minutes
          example: 148
        overview:
          type: string
          description: Plot summary or description
          example: "A thief who steals corporate secrets..."
        budget:
          type: integer
          format: int64
          description: Production budget in USD
          example: 160000000
        revenue:
          type: integer
          format: int64
          description: Box office revenue in USD
          example: 825532764
        mpa_rating:
          type: string
          description: MPA rating (G, PG, PG-13, R, NC-17, etc.)
          example: "PG-13"
        collection:
          type: string
          nullable: true
          description: Movie collection or franchise name
          example: "The Inception Collection"
        poster_url:
          type: string
          format: uri
          description: URL to movie poster image
          example: "https://image.tmdb.org/t/p/w500/xxx.jpg"
        backdrop_url:
          type: string
          format: uri
          description: URL to backdrop/banner image
          example: "https://image.tmdb.org/t/p/w1280/yyy.jpg"

    Genre:
      type: object
      properties:
        genre_id:
          type: integer
          description: Unique identifier for the genre
          example: 1
        name:
          type: string
          description: Genre name
          example: "Action"

    Studio:
      type: object
      properties:
        studio_id:
          type: integer
          description: Unique identifier for the studio
          example: 10
        name:
          type: string
          description: Studio name
          example: "Warner Bros."
        country:
          type: string
          description: Country where studio is based
          example: "USA"
        logo_url:
          type: string
          format: uri
          description: URL to studio logo
          example: "https://studio.example.com/logos/warner.png"

    Person:
      type: object
      properties:
        person_id:
          type: integer
          description: Unique identifier for the person
          example: 501
        name:
          type: string
          description: Full name
          example: "Christopher Nolan"
        profile_url:
          type: string
          format: uri
          description: URL to profile photo
          example: "https://image.tmdb.org/t/p/w300/zzz.jpg"

    # ----- Join / Relationship Entities -----
    Movie_Genre:
      type: object
      required:
        - movie_id
        - genre_id
      properties:
        movie_genre_id:
          type: integer
          description: Unique identifier for this association
          example: 1001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        genre_id:
          type: integer
          description: Reference to genre
          example: 1

    Movie_Cast:
      type: object
      required:
        - movie_id
        - person_id
      properties:
        uniqueId:
          type: integer
          description: Primary key for the movie_cast row
          example: 3001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        person_id:
          type: integer
          description: Reference to person (actor)
          example: 900
        character_name:
          type: string
          description: Name of character played
          example: "Dom Cobb"
        cast_order:
          type: integer
          description: Billing order (1 = top billing)
          example: 1

    Movie_Director:
      type: object
      required:
        - movie_id
        - person_id
      properties:
        movie_director_id:
          type: integer
          description: Unique identifier for this association
          example: 4001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        person_id:
          type: integer
          description: Reference to person (director)
          example: 501

    Movie_Producer:
      type: object
      required:
        - movie_id
        - person_id
      properties:
        movie_producer_id:
          type: integer
          description: Unique identifier for this association
          example: 5001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        person_id:
          type: integer
          description: Reference to person (producer)
          example: 602

    Movie_Studios:
      type: object
      required:
        - movie_id
        - studio_id
      properties:
        movie_studios_id:
          type: integer
          description: Unique identifier for this association
          example: 6001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        studio_id:
          type: integer
          description: Reference to studio
          example: 10

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Not found"
    
    BadRequest:
      description: Bad request - invalid input or parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Invalid input"
    
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Unauthorized - invalid or missing API key"
    
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Internal server error"

paths:

  ### ----------------------------
  ### Health Check
  ### ----------------------------

  /health:
    get:
      tags:
        - default
      summary: API health check
      description: Basic health endpoint (no API key required)
      security: []
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  ### ----------------------------
  ### Movies
  ### ----------------------------

  /movies:
    get:
      tags:
        - movies
      summary: List movies (paginated)
      description: Returns a paginated list of movies. Supports search and pagination.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (starts at 1)
          example: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
          description: Number of items per page (max 200)
          example: 25
        - in: query
          name: q
          schema:
            type: string
          description: Search query to filter movies by title
          example: "inception"
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A paginated list of movies
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 25
                  total:
                    type: integer
                    example: 2345
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - movies
      summary: Create a movie
      description: Create a new movie record in the database.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie'
      responses:
        '201':
          description: Movie successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /moviesbyyear:
    get:
      tags:
        - movies
      summary: Get movies by release year
      description: |
        Returns all movies released in the specified year. This endpoint is implemented
        and queries the cloud-hosted SQLite database.
        Example usage: `/moviesbyyear?year=2019`
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
          description: Year of release in YYYY format (e.g., 2019)
          example: "2019"
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of movies released in the specified year
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:
                    type: string
                    example: "2019"
                  count:
                    type: integer
                    example: 250
                  movies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /movies/{movie_id}:
    parameters:
      - in: path
        name: movie_id
        required: true
        schema:
          type: integer
        description: The unique identifier of the movie
        example: 123
    
    get:
      tags:
        - movies
      summary: Get movie by ID
      description: Retrieve a single movie by its unique identifier.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Movie found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags:
        - movies
      summary: Update a movie by ID
      description: Update an existing movie's information.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie'
      responses:
        '200':
          description: Movie successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags:
        - movies
      summary: Delete a movie
      description: Permanently delete a movie from the database.
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Movie successfully deleted (no content returned)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  ### ----------------------------
  ### Genres
  ### ----------------------------

  /genres:
    get:
      tags:
        - genres
      summary: List genres
      description: Retrieve all available movie genres.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of all genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genre'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - genres
      summary: Create a genre
      description: Add a new genre to the database.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Genre'
      responses:
        '201':
          description: Genre successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /genres/{genre_id}:
    parameters:
      - in: path
        name: genre_id
        required: true
        schema:
          type: integer
        description: The unique identifier of the genre
        example: 1
    
    get:
      tags:
        - genres
      summary: Get genre by ID
      description: Retrieve a single genre by its unique identifier.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Genre found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - genres
      summary: Update genre
      description: Update an existing genre's information.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Genre'
      responses:
        '200':
          description: Genre successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - genres
      summary: Delete genre
      description: Permanently delete a genre from the database.
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Genre successfully deleted (no content returned)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  ### ----------------------------
  ### Studios
  ### ----------------------------

  /studios:
    get:
      tags:
        - studios
      summary: List studios
      description: Retrieve all movie studios.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of all studios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Studio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - studios
      summary: Create studio
      description: Add a new studio to the database.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Studio'
      responses:
        '201':
          description: Studio successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Studio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /studios/{studio_id}:
    parameters:
      - in: path
        name: studio_id
        required: true
        schema:
          type: integer
        description: The unique identifier of the studio
        example: 10
    
    get:
      tags:
        - studios
      summary: Get studio by ID
      description: Retrieve a single studio by its unique identifier.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Studio found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Studio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - studios
      summary: Update studio
      description: Update an existing studio's information.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Studio'
      responses:
        '200':
          description: Studio successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Studio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - studios
      summary: Delete studio
      description: Permanently delete a studio from the database.
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Studio successfully deleted (no content returned)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  ### ----------------------------
  ### People
  ### ----------------------------

  /people:
    get:
      tags:
        - people
      summary: List people
      description: Retrieve all people (actors, directors, producers, etc.).
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of all people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
