openapi: 3.0.3
info:
  title: Movie Database API
  version: "1.0.0"
  description: |
    REST API for the Movies dataset. Routes are protected by an API key header `X-API-Key`.
    This API provides full CRUD operations for Movies, Genres, Studios, Actors, Directors, and relationship tables (cast, directors, producers, genres, studios).

    **Published Web API**  
    Hosted at: [https://tcss460-moviewebapi.onrender.com](https://tcss460-moviewebapi.onrender.com)

servers:
  - url: https://tcss460-moviewebapi.onrender.com
    description: Production server
  - url: http://localhost:3000
    description: Local development

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required for most endpoints. Contact the administrator to obtain an API key.

  schemas:
    Movie:
      type: object
      required:
        - title
      properties:
        movie_id:
          type: integer
          description: Unique identifier for the movie
          example: 123
        title:
          type: string
          description: Movie title
          example: "Inception"
        original_title:
          type: string
          description: Original title (if different from English title)
          example: "Inception"
        release_date:
          type: string
          format: date
          description: Release date in YYYY-MM-DD format
          example: "2010-07-16"
        runtime_in_minutes:
          type: integer
          description: Runtime in minutes
          example: 148
        overview:
          type: string
          description: Plot summary or description
          example: "A thief who steals corporate secrets..."
        budget:
          type: integer
          format: int64
          description: Production budget in USD
          example: 160000000
        revenue:
          type: integer
          format: int64
          description: Box office revenue in USD
          example: 825532764
        mpa_rating:
          type: string
          description: MPA rating (G, PG, PG-13, R, NC-17, etc.)
          example: "PG-13"
        collection:
          type: string
          nullable: true
          description: Movie collection or franchise name
          example: "The Inception Collection"
        poster_url:
          type: string
          format: uri
          description: URL to movie poster image
          example: "https://image.tmdb.org/t/p/w500/xxx.jpg"
        backdrop_url:
          type: string
          format: uri
          description: URL to backdrop/banner image
          example: "https://image.tmdb.org/t/p/w1280/yyy.jpg"

    Genre:
      type: object
      properties:
        genre_id:
          type: integer
          description: Unique identifier for the genre
          example: 1
        genre_name:
          type: string
          description: Genre name
          example: "Action"

    Studio:
      type: object
      properties:
        studio_id:
          type: integer
          description: Unique identifier for the studio
          example: 10
        studio_name:
          type: string
          description: Studio name
          example: "Warner Bros."
        studio_country:
          type: string
          description: Country where studio is based
          example: "USA"
        studio_logo:
          type: string
          format: uri
          description: URL to studio logo
          example: "https://studio.example.com/logos/warner.png"

    StudioInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Studio name
          example: "Warner Bros."
        country:
          type: string
          description: Country where studio is based
          example: "USA"
        logo_url:
          type: string
          format: uri
          description: URL to studio logo
          example: "https://studio.example.com/logos/warner.png"

    ActorInput:
      type: object
      required:
        - actor_name
      properties:
        actor_name:
          type: string
          description: Full name of the actor
          example: "Leonardo DiCaprio"
        profile_url:
          type: string
          format: uri
          description: URL to profile photo
          example: "https://image.tmdb.org/t/p/w300/actor.jpg"

    DirectorInput:
      type: object
      required:
        - director_name
      properties:
        director_name:
          type: string
          description: Full name of the director
          example: "Christopher Nolan"

    GenreInput:
      type: object
      required:
        - genre_name
      properties:
        genre_name:
          type: string
          description: Genre name
          example: "Action"

    MovieInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Movie title
          example: "Inception"
        original_title:
          type: string
          description: Original title (if different from English title)
          example: "Inception"
        release_date:
          type: string
          format: date
          description: Release date in YYYY-MM-DD format
          example: "2010-07-16"
        runtime_in_minutes:
          type: integer
          description: Runtime in minutes
          example: 148
        overview:
          type: string
          description: Plot summary or description
          example: "A thief who steals corporate secrets..."
        budget:
          type: integer
          format: int64
          description: Production budget in USD
          example: 160000000
        revenue:
          type: integer
          format: int64
          description: Box office revenue in USD
          example: 825532764
        mpa_rating:
          type: string
          description: MPA rating (G, PG, PG-13, R, NC-17, etc.)
          example: "PG-13"
        collection:
          type: string
          nullable: true
          description: Movie collection or franchise name
          example: "The Inception Collection"
        poster_url:
          type: string
          format: uri
          description: URL to movie poster image
          example: "https://image.tmdb.org/t/p/w500/xxx.jpg"
        backdrop_url:
          type: string
          format: uri
          description: URL to backdrop/banner image
          example: "https://image.tmdb.org/t/p/w1280/yyy.jpg"

    Actor:
      type: object
      properties:
        actor_id:
          type: integer
          description: Unique identifier for the actor
          example: 900
        actor_name:
          type: string
          description: Full name of the actor
          example: "Leonardo DiCaprio"
        profile_url:
          type: string
          format: uri
          description: URL to profile photo
          example: "https://image.tmdb.org/t/p/w300/actor.jpg"

    Director:
      type: object
      properties:
        director_id:
          type: integer
          description: Unique identifier for the director
          example: 501
        director_name:
          type: string
          description: Full name of the director
          example: "Christopher Nolan"

    Producer:
      type: object
      properties:
        producer_id:
          type: integer
          description: Unique identifier for the producer
          example: 602
        producer_name:
          type: string
          description: Full name of the producer
          example: "Emma Thomas"

    Movie_Genre:
      type: object
      required:
        - movie_id
        - genre_id
      properties:
        movie_genre_id:
          type: integer
          description: Unique identifier for this association
          example: 1001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        genre_id:
          type: integer
          description: Reference to genre
          example: 1

    Cast:
      type: object
      required:
        - movie_id
        - actor_id
      properties:
        cast_id:
          type: integer
          description: Primary key for the cast row
          example: 3001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        actor_id:
          type: integer
          description: Reference to actor
          example: 900
        character_name:
          type: string
          description: Name of character played
          example: "Dom Cobb"

    Movie_Director:
      type: object
      required:
        - movie_id
        - director_id
      properties:
        movie_director_id:
          type: integer
          description: Unique identifier for this association
          example: 4001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        director_id:
          type: integer
          description: Reference to director
          example: 501

    Movie_Producer:
      type: object
      required:
        - movie_id
        - producer_id
      properties:
        movie_producer_id:
          type: integer
          description: Unique identifier for this association
          example: 5001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        producer_id:
          type: integer
          description: Reference to producer
          example: 602

    Movie_Studios:
      type: object
      required:
        - movie_id
        - studio_id
      properties:
        movie_studio_id:
          type: integer
          description: Unique identifier for this association
          example: 6001
        movie_id:
          type: integer
          description: Reference to movie
          example: 123
        studio_id:
          type: integer
          description: Reference to studio
          example: 10

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Not found"
    
    BadRequest:
      description: Bad request - invalid input or parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid input"
    
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Unauthorized - invalid or missing API key"
    
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Internal server error"

paths:
  /health:
    get:
      tags:
        - default
      summary: API health check
      description: Basic health endpoint to verify API is operational. No API key required.
      security: []
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /moviesbyyear:
    get:
      tags:
        - movies
      summary: Get movies by release year
      description: Returns all movies released in the specified year.
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
          description: Year of release in YYYY format
          example: "2025"
      security: []
      responses:
        '200':
          description: List of movies released in the specified year
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:
                    type: string
                    example: "2025"
                  count:
                    type: integer
                    example: 5
                  movies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /movies:
    get:
      tags:
        - movies
      summary: List movies with pagination and search
      description: Returns a paginated list of movies with optional title search.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page
        - in: query
          name: q
          schema:
            type: string
          description: Search query to filter movies by title
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Paginated list of movies
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - movies
      summary: Create a new movie
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
      responses:
        '201':
          description: Movie created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /movies/{movie_id}:
    parameters:
      - in: path
        name: movie_id
        required: true
        schema:
          type: integer
        description: The unique identifier of the movie
    
    get:
      tags:
        - movies
      summary: Get movie by ID
      description: Returns detailed information about a specific movie.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Movie details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags:
        - movies
      summary: Update a movie
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
      responses:
        '200':
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags:
        - movies
      summary: Delete a movie
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Movie deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /genres:
    get:
      tags:
        - genres
      summary: List all genres
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genre'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - genres
      summary: Create a new genre
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreInput'
      responses:
        '201':
          description: Genre created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /genres/{genre_id}:
    parameters:
      - in: path
        name: genre_id
        required: true
        schema:
          type: integer
    
    get:
      tags:
        - genres
      summary: Get genre by ID
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Genre details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - genres
      summary: Update a genre
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreInput'
      responses:
        '200':
          description: Genre updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - genres
      summary: Delete a genre
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Genre deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /studios:
    get:
      tags:
        - studios
      summary: List all studios
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of studios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Studio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - studios
      summary: Create a new studio
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioInput'
      responses:
        '201':
          description: Studio created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Studio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /studios/{studio_id}:
    parameters:
      - in: path
        name: studio_id
        required: true
        schema:
          type: integer
    
    get:
      tags:
        - studios
      summary: Get studio by ID
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Studio details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Studio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - studios
      summary: Update a studio
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioInput'
      responses:
        '200':
          description: Studio updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Studio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - studios
      summary: Delete a studio
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Studio deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
          
    /actors:
    get:
      tags:
        - actors
      summary: List all actors
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of actors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - actors
      summary: Create a new actor
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorInput'
      responses:
        '201':
          description: Actor created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /actors/{actor_id}:
    parameters:
      - in: path
        name: actor_id
        required: true
        schema:
          type: integer
    
    get:
      tags:
        - actors
      summary: Get actor by ID
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Actor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - actors
      summary: Update an actor
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorInput'
      responses:
        '200':
          description: Actor updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - actors
      summary: Delete an actor
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Actor deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /actors/{actor_id}/movies:
    parameters:
      - in: path
        name: actor_id
        required: true
        schema:
          type: integer
    
    get:
      tags:
        - actors
      summary: Get all movies for an actor
      description: Returns all movies featuring the specified actor, including character names
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of movies for the actor
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Movie'
                    - type: object
                      properties:
                        character_name:
                          type: string
                          description: Character played in this movie
                          example: "Dom Cobb"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /directors:
    get:
      tags:
        - directors
      summary: List all directors
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of directors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Director'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - directors
      summary: Create a new director
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectorInput'
      responses:
        '201':
          description: Director created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Director'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
